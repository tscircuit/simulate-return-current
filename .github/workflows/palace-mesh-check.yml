name: Palace Mesh Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  mesh-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: pip install -r lib/palace/python/requirements.txt
      - run: bun install
      - run: bun test tests/palace/explicit-mesh.test.tsx tests/palace/multilayer-mesh.test.tsx tests/palace/multilayer-surface.test.ts tests/palace/trace-caps.test.tsx tests/palace/surface-impedance.test.tsx
        env:
          PALACE_MESH_PYTHON: python
